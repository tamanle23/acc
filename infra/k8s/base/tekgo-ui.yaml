apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekgo-ui
  labels:
    app: tekgo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tekgo-ui
  template:
    metadata:
      labels:
        app: tekgo-ui
    spec:
      containers:
      - name: tekgo-ui
        image: acc/tekgo-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: tekgo-ui
spec:
  selector:
    app: tekgo-ui
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
