##### Spring configuration properties #####
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
        decode404: false
        requestInterceptors:
          - com.unipost.fw.client.interceptor.FeignContextInterceptor
logging:
  config: classpath:logback-local.xml

#Spring actuator configuration1
management:
  health:
    mail:
      enabled: false
    jms:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      profiles: ${spring.profiles.active}
    enable:
      all: true
    export:
      jmx:
        enabled: true
      prometheus:
        enabled: true
    web:
      client:
        request:
          metric-name: http.client.requests

