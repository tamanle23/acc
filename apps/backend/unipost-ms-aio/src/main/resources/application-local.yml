    enabled: true
    broker:
      url: "tcp://192.168.99.100:32768/"
      username: admin
      password: admin
  security:
    maxSession: 1
    sessionExpiredUrl: /api/auth/expire
    tokenUrl: api/auth/token
    tokenInvalidateUrl: api/auth/logout
    permitAlls:
      - /login
      - /register
      - /actuator/health
      - /resources/**
      - /jsMsgSource*
      - /api/auth/token
      - /api/scheduler/**
      - /fs/explorer/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /graphql
      - /graphiql
      - /graphiql/**
      - /api/v1/public/**
      - /api/v1/metadata/blueprints
      - /api/v1/metadata/blueprints/**
      - /api/v1/billing/payos/webhook
      - /api/v1/billing/payos/webhook/**
    jwtCookieName: X-AUTH-TOKEN
    jwtCookieDomain:
    jwtCookiePath: /
    jwtCookieSecure: false
    jwtTokenHeader: Authorization
    jwtTokenSecret: OTMxMURGMEJFMjA0MTBFOEUyMUIzQTU1MjFGMzkxRTFBODM5Mzc1MkZDNUNGQkM4ODUyNTU2RENERUI3RkVGREVGODVFMjZENDQ2MkE3MjcyMTk2MDlDNzE5NDg3MzgyNEE2RDZDQ0QwMTA3Qjg4REFDRUI5OUZEMUYwQ0MwMDI=
    jwtTokenExpiration: 360000000 # 60 * 60 * 1000 * 100 = 6000 mins
