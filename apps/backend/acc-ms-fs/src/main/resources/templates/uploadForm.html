<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:if="${message}">
    <h2 th:text="${message}" />
  </div>
  <div>
    <form method="POST" enctype="multipart/form-data" action="/fs/explorer">
      <table>
        <tr>
          <td>File to upload:</td>
          <td><input type="file" name="files" multiple="true" /></td>
        </tr>
        <tr>
          <td></td>
          <td><input type="submit" value="Upload" /></td>
        </tr>
      </table>
    </form>
  </div>
  <div>
    <ul>
      <li th:each="fsObject : ${fsObjects}">
        <a th:href="${fsObject}" th:text="${fsObject}" />
      </li>
    </ul>
  </div>
</body>
</html>
