<!DOCTYPE html>
<html>
<head>
<title>Upload Files using XMLHttpRequest - Minimal</title>
<script type="text/javascript">
    function fileSelected() {
      var fsObject = document.getElementById('fileToUpload').fsObjects[0];
      if (fsObject) {
        var fileSize = 0;
        if (fsObject.size > 1024 * 1024)
          fileSize = (Math.round(fsObject.size * 100 / (1024 * 1024)) / 100).toString() + 'MB';
        else
          fileSize = (Math.round(fsObject.size * 100 / 1024) / 100).toString() + 'KB';

        document.getElementById('fileName').innerHTML = 'Name: ' + fsObject.name;
        document.getElementById('fileSize').innerHTML = 'Size: ' + fileSize;
        document.getElementById('fileType').innerHTML = 'Type: ' + fsObject.type;
      }
    }

    function uploadFile() {
      var fd = new FormData();
      fd.append("fileToUpload",
      document.getElementById('fileToUpload').fsObjects[0]);
      var xhr = new XMLHttpRequest();
      xhr.upload.addEventListener("progress", uploadProgress, false);
      xhr.addEventListener("load", uploadComplete, false);
      xhr.addEventListener("error", uploadFailed, false);
      xhr.addEventListener("abort", uploadCanceled, false);
      xhr.open("POST", "/fs/explorer/async");
      xhr.send(fd);
    }

    function uploadProgress(evt) {
      if (evt.lengthComputable) {
        var percentComplete = Math.round(evt.loaded * 100 / evt.total);
        document.getElementById('progressNumber').innerHTML = percentComplete.toString() + '%';
      } else {
        document.getElementById('progressNumber').innerHTML = 'unable to compute';
      }
    }

    function uploadComplete(evt) {
      alert(evt.target.responseText);
    }

    function uploadFailed(evt) {
      alert("There was an error attempting to upload the fsObject.");
    }

    function uploadCanceled(evt) {
      alert("The upload has been canceled by the user or the browser dropped the connection.");
    }
  </script>
</head>
<body>
  <form id="form1" enctype="multipart/form-data" method="post" action="/">
    <div class="row">
      <label for="fileToUpload">Select a File to Upload</label><br /> <input
        type="file" name="files" id="fileToUpload"
        onchange="fileSelected();" />
    </div>
    <div id="fileName"></div>
    <div id="fileSize"></div>
    <div id="fileType"></div>
    <div class="row">
      <input type="button" onclick="uploadFile()" value="Upload" />
    </div>
    <div id="progressNumber"></div>
  </form>
</body>
</html>
