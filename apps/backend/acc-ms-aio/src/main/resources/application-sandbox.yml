spring:
  datasource:
    url: jdbc:pglite:../../tmp/db/pglite-sandbox.db
    driver-class-name: io.roastedroot.pglite4j.jdbc.PgLiteDriver
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
  liquibase:
    enabled: true
    change-log: classpath:db/sandbox/changelog-master.xml
    contexts: dev,test,local

application:
  sandbox:
    enabled: true
    mode: DEV
    dev:
      pristine: false
    database:
      embedded-pglite: true
      dev-storage-path: ../../tmp/db/pglite-sandbox.db
