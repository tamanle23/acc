<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACC Studio Preview — Dedicated NLE</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style id="boot-splash-style">
    :root {
      --accent-primary: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.4);
      --glass-bg: rgba(11, 17, 33, 0.72);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-highlight: rgba(255, 255, 255, 0.22);
      --glass-specular: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
      --glass-blur: blur(24px);
      --foreground: 210 40% 98%;
      --muted-foreground: 215 20.2% 65.1%;
      --splash-backdrop-bg: #020617cc;
      --splash-ambient-mesh: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent-primary) 14%, transparent) 0%, transparent 60%);
    }

    html.light,
    .light {
      --accent-primary: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.25);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-border-highlight: rgba(255, 255, 255, 0.9);
      --glass-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.12);
      --glass-blur: blur(20px);
      --foreground: 222.2 84% 4.9%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --splash-backdrop-bg: rgba(241, 245, 249, 0.88);
      --splash-ambient-mesh: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent-primary) 10%, transparent) 0%, transparent 60%);
    }

    [data-glass-style="frosted"] {
      --glass-specular: none !important;
      --glass-shadow: 0 6px 20px 0 rgba(0, 0, 0, 0.4) !important;
    }

    [data-glass-style="cyber"] {
      --glass-specular: inset 0 1px 0 0 color-mix(in srgb, var(--accent-primary) 35%, transparent) !important;
      --glass-border-highlight: var(--accent-primary) !important;
      --glass-border: color-mix(in srgb, var(--accent-primary) 45%, transparent) !important;
      --glass-shadow: 0 0 26px -2px color-mix(in srgb, var(--accent-primary) 40%, transparent) !important;
    }

    [data-blur-intensity="low"] {
      --glass-blur: blur(6px) !important;
    }

    [data-blur-intensity="high"] {
      --glass-blur: blur(40px) !important;
    }

    #app-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--splash-ambient-mesh), var(--splash-backdrop-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: hsl(var(--foreground));
      will-change: opacity;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .splash-card {
      width: min(90vw, 380px);
      padding: 36px 32px 30px;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), var(--glass-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, backdrop-filter 0.3s ease;
    }

    .splash-logo-container {
      width: 64px;
      height: 64px;
      margin-bottom: 18px;
      position: relative;
      filter: drop-shadow(0 0 18px var(--accent-glow)) drop-shadow(0 0 32px color-mix(in srgb, var(--accent-primary) 35%, transparent));
      animation: splash-pulse 2.8s ease-in-out infinite;
      will-change: transform, opacity;
      transition: filter 0.3s ease;
    }

    .splash-logo-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .splash-ring-outer {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-spin 12s linear infinite;
      will-change: transform;
    }

    .splash-ring-orbit {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-spin 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }

    .splash-play-icon {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-pulse 2s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .splash-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: hsl(var(--foreground));
      margin-bottom: 6px;
      transition: color 0.3s ease;
    }

    .splash-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--accent-primary);
      text-transform: uppercase;
      margin-bottom: 24px;
      padding: 3px 10px;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--accent-primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent-primary) 28%, transparent);
      transition: color 0.3s ease, background 0.3s ease, border-color 0.3s ease;
    }

    .splash-progress-track {
      width: 100%;
      height: 3px;
      background: var(--glass-border);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
      transition: background 0.3s ease;
    }

    .splash-progress-bar {
      position: absolute;
      inset: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent-primary), color-mix(in srgb, var(--accent-primary) 60%, #8b5cf6), transparent);
      border-radius: 9999px;
      animation: splash-shimmer 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
      transition: background 0.3s ease;
    }

    .splash-status {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: hsl(var(--muted-foreground));
      min-height: 18px;
      transition: color 0.2s ease;
    }

    .splash-reload-btn {
      margin-top: 14px;
      font-size: 11px;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 500;
      color: var(--accent-primary);
      background: color-mix(in srgb, var(--accent-primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent-primary) 35%, transparent);
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .splash-reload-btn:hover {
      background: color-mix(in srgb, var(--accent-primary) 24%, transparent);
      border-color: var(--accent-primary);
    }

    @keyframes splash-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.92;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes splash-shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(250%);
      }
    }

    @keyframes splash-fade-out {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    #app-boot-splash.splash-hidden,
    .splash-hidden {
      animation: splash-fade-out var(--splash-outro-duration, 800ms) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: none;
      opacity: 0;
    }

    #app-boot-splash.splash-hidden .splash-card,
    .splash-hidden .splash-card {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-logo-container {
        animation: none !important;
      }

      .splash-ring-orbit {
        animation: splash-spin 3.5s linear infinite !important;
      }

      .splash-progress-bar {
        animation: splash-shimmer 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
      }
    }
  </style>
  <script id="splash-theme-init">
    (function () {
      try {
        var raw = localStorage.getItem('acc_studio_theme_prefs');
        if (!raw) return;
        var p = JSON.parse(raw);
        var root = document.documentElement;
        var isDark = p.mode !== 'light';
        root.classList.toggle('dark', isDark);
        root.classList.toggle('light', !isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
        if (p.presetId) root.setAttribute('data-theme-preset', p.presetId);
        if (p.glassStyle) root.setAttribute('data-glass-style', p.glassStyle);
        if (p.blurIntensity) root.setAttribute('data-blur-intensity', p.blurIntensity);

        var presets = {
          'obsidian': { bg: 'rgba(11, 17, 33, 0.72)', border: 'rgba(255, 255, 255, 0.12)', primary: '#06b6d4', glow: 'rgba(6, 182, 212, 0.4)', hsl: '189 94% 43%' },
          'tokyo-night': { bg: 'rgba(26, 27, 38, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#7aa2f7', glow: 'rgba(122, 162, 247, 0.4)', hsl: '225 73% 57%' },
          'catppuccin-mocha': { bg: 'rgba(30, 30, 46, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#cba6f7', glow: 'rgba(203, 166, 247, 0.4)', hsl: '267 84% 81%' },
          'catppuccin-latte': { bg: 'rgba(239, 241, 245, 0.82)', border: 'rgba(76, 79, 105, 0.12)', primary: '#8839ef', glow: 'rgba(136, 57, 239, 0.3)', hsl: '267 84% 58%' },
          'dracula-pro': { bg: 'rgba(40, 42, 54, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#bd93f9', glow: 'rgba(189, 147, 249, 0.4)', hsl: '265 89% 78%' },
          'nord-frost': { bg: 'rgba(46, 52, 64, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#88c0d0', glow: 'rgba(136, 192, 208, 0.4)', hsl: '193 43% 67%' },
          'one-dark-pro': { bg: 'rgba(33, 37, 43, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#61afef', glow: 'rgba(97, 175, 239, 0.4)', hsl: '207 82% 66%' },
          'github-dark-dimmed': { bg: 'rgba(13, 17, 23, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#58a6ff', glow: 'rgba(88, 166, 255, 0.4)', hsl: '212 100% 67%' },
          'github-light-modern': { bg: 'rgba(255, 255, 255, 0.85)', border: 'rgba(31, 35, 40, 0.12)', primary: '#0969da', glow: 'rgba(9, 105, 218, 0.3)', hsl: '213 92% 45%' },
          'monokai-pro': { bg: 'rgba(45, 42, 46, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#ffd866', glow: 'rgba(255, 216, 102, 0.4)', hsl: '45 100% 70%' },
          'cyberpunk-2077': { bg: 'rgba(0, 11, 30, 0.82)', border: 'rgba(0, 240, 255, 0.35)', primary: '#00f0ff', glow: 'rgba(0, 240, 255, 0.45)', hsl: '180 100% 50%' },
          'synthwave-84': { bg: 'rgba(38, 35, 53, 0.78)', border: 'rgba(255, 126, 219, 0.35)', primary: '#ff7edb', glow: 'rgba(255, 126, 219, 0.45)', hsl: '317 100% 74%' },
          'solarized-dark': { bg: 'rgba(0, 43, 54, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#268bd2', glow: 'rgba(38, 139, 210, 0.4)', hsl: '205 69% 49%' },
          'solarized-light': { bg: 'rgba(253, 246, 227, 0.85)', border: 'rgba(101, 123, 131, 0.15)', primary: '#268bd2', glow: 'rgba(38, 139, 210, 0.3)', hsl: '205 69% 49%' },
          'gruvbox-dark': { bg: 'rgba(40, 40, 40, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#fe8019', glow: 'rgba(254, 128, 25, 0.4)', hsl: '27 98% 54%' },
          'rose-pine': { bg: 'rgba(25, 23, 36, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#ebbcba', glow: 'rgba(235, 188, 186, 0.4)', hsl: '2 55% 83%' },
          'horizon-dark': { bg: 'rgba(28, 30, 38, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#e95678', glow: 'rgba(233, 86, 120, 0.4)', hsl: '346 76% 63%' },
          'ayu-mirage': { bg: 'rgba(31, 36, 48, 0.75)', border: 'rgba(255, 255, 255, 0.08)', primary: '#ffcc66', glow: 'rgba(255, 204, 102, 0.4)', hsl: '40 100% 70%' },
          'midnight-oled': { bg: 'rgba(0, 0, 0, 0.85)', border: 'rgba(255, 255, 255, 0.08)', primary: '#38bdf8', glow: 'rgba(56, 189, 248, 0.4)', hsl: '199 89% 60%' },
          'vesper-noir': { bg: 'rgba(16, 16, 16, 0.8)', border: 'rgba(255, 255, 255, 0.08)', primary: '#ffc799', glow: 'rgba(255, 199, 153, 0.4)', hsl: '27 100% 80%' }
        };
        var pr = presets[p.presetId] || presets['obsidian'];
        root.style.setProperty('--accent-primary', pr.primary);
        root.style.setProperty('--color-brand-accent', pr.primary);
        root.style.setProperty('--accent-glow', pr.glow);
        root.style.setProperty('--primary', pr.hsl);
        root.style.setProperty('--ring', pr.hsl);
        root.style.setProperty('--glass-bg', pr.bg);
        root.style.setProperty('--glass-border', pr.border);

        if (p.blurIntensity === 'low') root.style.setProperty('--glass-blur', 'blur(6px)');
        else if (p.blurIntensity === 'high') root.style.setProperty('--glass-blur', 'blur(40px)');
        else root.style.setProperty('--glass-blur', 'blur(18px)');

        if (p.glassStyle === 'frosted') {
          root.style.setProperty('--glass-specular', 'none');
          root.style.setProperty('--glass-shadow', isDark ? '0 6px 20px 0 rgba(0, 0, 0, 0.4)' : '0 4px 16px 0 rgba(0, 0, 0, 0.05)');
        } else if (p.glassStyle === 'cyber') {
          root.style.setProperty('--glass-specular', 'inset 0 1px 0 0 color-mix(in srgb, ' + pr.primary + ' 30%, transparent)');
          root.style.setProperty('--glass-border-highlight', pr.primary);
          root.style.setProperty('--glass-border', 'color-mix(in srgb, ' + pr.primary + ' 45%, transparent)');
          root.style.setProperty('--glass-shadow', '0 0 24px -4px color-mix(in srgb, ' + pr.primary + ' 30%, transparent)');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-[#020617] text-slate-100 antialiased h-screen overflow-hidden">
  <!-- Tier 1: Instant Pre-Hydration Zero-JS Splash -->
  <div id="app-boot-splash" role="status" aria-live="polite" aria-label="Loading ACC Studio Workstation">
    <div class="splash-card">
      <div class="splash-logo-container">
        <svg class="splash-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-orbit-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--accent-primary, #06b6d4)" />
              <stop offset="0.5" stop-color="color-mix(in srgb, var(--accent-primary, #06b6d4) 60%, #8b5cf6)" />
              <stop offset="1" stop-color="color-mix(in srgb, var(--accent-primary, #06b6d4) 30%, #ec4899)" />
            </linearGradient>
            <linearGradient id="splash-play-grad" x1="18" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--accent-primary, #06b6d4)" />
              <stop offset="1" stop-color="color-mix(in srgb, var(--accent-primary, #06b6d4) 60%, #8b5cf6)" />
            </linearGradient>
          </defs>
          <!-- Outer Rotating Lens Aperture Track -->
          <circle class="splash-ring-outer" cx="24" cy="24" r="22" stroke="color-mix(in srgb, var(--accent-primary, #06b6d4) 35%, transparent)" stroke-width="1.5" stroke-dasharray="4 4">
            <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="12s" repeatCount="indefinite" />
          </circle>
          <!-- Fast Orbiting Radar/Loader Arc -->
          <circle class="splash-ring-orbit" cx="24" cy="24" r="18" stroke="url(#splash-orbit-grad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="28 85">
            <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="1.8s" repeatCount="indefinite" />
          </circle>
          <!-- Inner Stabilizer Ring -->
          <circle cx="24" cy="24" r="14" stroke="var(--glass-border-highlight, rgba(255, 255, 255, 0.15))" stroke-width="1" />
          <!-- Breathing Playhead Symbol -->
          <path class="splash-play-icon" d="M21 16.5L31 24L21 31.5V16.5Z" fill="url(#splash-play-grad)">
            <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite" />
          </path>
        </svg>
      </div>
      <div class="splash-title">ACC STUDIO</div>
      <div class="splash-badge">PRO NLE • WEBCODECS &amp; IR ENGINE</div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div id="splash-status-text" class="splash-status">Initializing workstation...</div>
      <button id="splash-reload-btn" class="splash-reload-btn" onclick="window.location.reload()" style="display:none;">
        Reload Workstation
      </button>
    </div>
  </div>
  <script>
    (function () {
      window.__studioBootStartTime = performance.now();
      var t1 = setTimeout(function () {
        var el = document.getElementById('splash-status-text');
        if (el) el.textContent = 'Loading video & audio subsystems...';
      }, 5000);
      var t2 = setTimeout(function () {
        var el = document.getElementById('splash-status-text');
        if (el) el.textContent = 'Taking longer than usual...';
        var btn = document.getElementById('splash-reload-btn');
        if (btn) btn.style.display = 'inline-block';
      }, 10000);
      window.__studioBootTimers = [t1, t2];
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
