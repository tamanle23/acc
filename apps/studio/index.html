<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACC Studio Preview — Dedicated NLE</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style id="boot-splash-style">
    #app-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, rgba(6, 182, 212, 0.12) 0%, transparent 60%), #020617cc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      will-change: opacity;
    }

    .splash-card {
      width: min(90vw, 380px);
      padding: 36px 32px 30px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 20px 50px -10px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .splash-logo-container {
      width: 64px;
      height: 64px;
      margin-bottom: 18px;
      position: relative;
      filter: drop-shadow(0 0 18px rgba(6, 182, 212, 0.65)) drop-shadow(0 0 32px rgba(139, 92, 246, 0.35));
      animation: splash-pulse 2.8s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .splash-logo-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .splash-ring-outer {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-spin 12s linear infinite;
      will-change: transform;
    }

    .splash-ring-orbit {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-spin 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }

    .splash-play-icon {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-pulse 2s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .splash-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .splash-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #06b6d4;
      text-transform: uppercase;
      margin-bottom: 24px;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.28);
    }

    .splash-progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    .splash-progress-bar {
      position: absolute;
      inset: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #06b6d4, #8b5cf6, transparent);
      border-radius: 9999px;
      animation: splash-shimmer 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }

    .splash-status {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #94a3b8;
      min-height: 18px;
      transition: color 0.2s ease;
    }

    .splash-reload-btn {
      margin-top: 14px;
      font-size: 11px;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 500;
      color: #06b6d4;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.35);
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .splash-reload-btn:hover {
      background: rgba(6, 182, 212, 0.24);
      border-color: rgba(6, 182, 212, 0.6);
    }

    @keyframes splash-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.92;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes splash-shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(250%);
      }
    }

    @keyframes splash-fade-out {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    #app-boot-splash.splash-hidden,
    .splash-hidden {
      animation: splash-fade-out var(--splash-outro-duration, 800ms) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: none;
      opacity: 0;
    }

    #app-boot-splash.splash-hidden .splash-card,
    .splash-hidden .splash-card {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-logo-container {
        animation: none !important;
      }

      .splash-ring-orbit {
        animation: splash-spin 3.5s linear infinite !important;
      }

      .splash-progress-bar {
        animation: splash-shimmer 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
      }
    }
  </style>
</head>

<body class="bg-[#020617] text-slate-100 antialiased h-screen overflow-hidden">
  <!-- Tier 1: Instant Pre-Hydration Zero-JS Splash -->
  <div id="app-boot-splash" role="status" aria-live="polite" aria-label="Loading ACC Studio Workstation">
    <div class="splash-card">
      <div class="splash-logo-container">
        <svg class="splash-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-orbit-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
              <stop stop-color="#06b6d4" />
              <stop offset="0.5" stop-color="#8b5cf6" />
              <stop offset="1" stop-color="#ec4899" />
            </linearGradient>
            <linearGradient id="splash-play-grad" x1="18" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#22d3ee" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <!-- Outer Rotating Lens Aperture Track -->
          <circle class="splash-ring-outer" cx="24" cy="24" r="22" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5" stroke-dasharray="4 4">
            <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="12s" repeatCount="indefinite" />
          </circle>
          <!-- Fast Orbiting Radar/Loader Arc -->
          <circle class="splash-ring-orbit" cx="24" cy="24" r="18" stroke="url(#splash-orbit-grad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="28 85">
            <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="1.8s" repeatCount="indefinite" />
          </circle>
          <!-- Inner Stabilizer Ring -->
          <circle cx="24" cy="24" r="14" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
          <!-- Breathing Playhead Symbol -->
          <path class="splash-play-icon" d="M21 16.5L31 24L21 31.5V16.5Z" fill="url(#splash-play-grad)">
            <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite" />
          </path>
        </svg>
      </div>
      <div class="splash-title">ACC STUDIO</div>
      <div class="splash-badge">PRO NLE • WEBCODECS &amp; IR ENGINE</div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div id="splash-status-text" class="splash-status">Initializing workstation...</div>
      <button id="splash-reload-btn" class="splash-reload-btn" onclick="window.location.reload()" style="display:none;">
        Reload Workstation
      </button>
    </div>
  </div>
  <script>
    (function () {
      window.__studioBootStartTime = performance.now();
      var t1 = setTimeout(function () {
        var el = document.getElementById('splash-status-text');
        if (el) el.textContent = 'Loading video & audio subsystems...';
      }, 5000);
      var t2 = setTimeout(function () {
        var el = document.getElementById('splash-status-text');
        if (el) el.textContent = 'Taking longer than usual...';
        var btn = document.getElementById('splash-reload-btn');
        if (btn) btn.style.display = 'inline-block';
      }, 10000);
      window.__studioBootTimers = [t1, t2];
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
