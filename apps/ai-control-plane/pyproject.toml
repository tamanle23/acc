[project]
name = "ai-inference-backend"
version = "2.0.0"
description = "Enterprise high-throughput multi-purpose AI inference backend with in-app uv isolation and VieNeu-TTS v3 Turbo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.1.0",
    "soundfile>=0.12.1",
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "vieneu>=3.0.0",
    "kokoro-onnx>=0.6.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
