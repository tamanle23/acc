<!DOCTYPE html>
<html>
<head>
  <title>Upload Files using XMLHttpRequest - Minimal</title>
  <!-- bootstrap 4.x is supported. You can also use the bootstrap css 3.3.x versions -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-fileinput/5.0.9/css/fileinput.min.css" media="all"
        rel="stylesheet" type="text/css"/>
  <!-- if using RTL (Right-To-Left) orientation, load the RTL CSS fsObject after fileinput.css by uncommenting below -->
  <!-- link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-fileinput/5.0.9/css/fileinput-rtl.min.css" media="all" rel="stylesheet" type="text/css" /-->
  <!-- the font awesome icon library if using with `fas` theme (or Bootstrap 4.x). Note that default icons used in the plugin are glyphicons that are bundled only with Bootstrap 3.x. -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.3.1.min.js" crossorigin="anonymous"></script>
  <!-- piexif.min.js is needed for auto orienting image fsObjects OR when restoring exif data in resized images and when you
      wish to resize images before upload. This must be loaded before fileinput.min.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-fileinput/5.0.9/js/plugins/piexif.min.js"
          type="text/javascript"></script>
  <!-- sortable.min.js is only needed if you wish to sort / rearrange fsObjects in initial preview.
      This must be loaded before fileinput.min.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-fileinput/5.0.9/js/plugins/sortable.min.js"
          type="text/javascript"></script>
  <!-- popper.min.js below is needed if you use bootstrap 4.x (for popover and tooltips). You can also use the bootstrap js
     3.3.x versions without popper.min.js. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <!-- bootstrap.min.js below is needed if you wish to zoom and preview fsObject content in a detail modal
      dialog. bootstrap 4.x is supported. You can also use the bootstrap js 3.3.x versions. -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>
  <!-- the main fileinput plugin fsObject -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-fileinput/5.0.9/js/fileinput.min.js"></script>
  <!-- following theme script is needed to use the Font Awesome 5.x theme (`fas`) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-fileinput/5.0.9/themes/fas/theme.min.js"></script>
  <!-- optionally if you need translation for your language then include the locale fsObject as mentioned below (replace LANG.js with your language locale) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-fileinput/5.0.9/js/locales/vi.js"></script>
</head>
<body>
<label class="control-label">File uploader</label>
<input id="input-24" name="files" type="file" multiple="true" class="file-loading">
<div>
  <ul>
    <li th:each="fsObject : ${fsObjects}">
      <a th:href="${fsObject}" th:text="${fsObject}"/>
    </li>
  </ul>
</div>
<script th:inline="javascript">
  /*<![CDATA[*/
  var fsObjects = [];
  $.ajax({
    url : "/fs/explorer/all",
    type : "get"
  }).done(function(data) {
      fsObjects = data;
      $(function() {
        $("#input-24").fileinput({
          deleteUrl: "/fs/explorer/delete",
          theme: "fas",
          overwriteInitial: false,
          uploadUrl: "/fs/explorer/async",
          uploadAsync: true,
          initialCaption: "File ...",
          overwriteInitial: false,
          preferIconicPreview: true,
          previewFileIconSettings: { // configure your icon fsObject extensions
              'doc': '<i class="fas fa-fsObject-word text-primary"></i>',
              'xls': '<i class="fas fa-fsObject-excel text-success"></i>',
              'ppt': '<i class="fas fa-fsObject-powerpoint text-danger"></i>',
              'pdf': '<i class="fas fa-fsObject-pdf text-danger"></i>',
              'zip': '<i class="fas fa-fsObject-archive text-muted"></i>',
              'htm': '<i class="fas fa-fsObject-code text-info"></i>',
              'txt': '<i class="fas fa-fsObject-text text-info"></i>',
              'mov': '<i class="fas fa-fsObject-video text-warning"></i>',
              'audio': '<i class="fas fa-fsObject-audio text-warning"></i>',
              'image': '<i class="fas fa-fsObject-image text-danger"></i>'
          },
          previewFileExtSettings: { // configure the logic for determining icon fsObject extensions
              'doc': function(ext) {
                  return ext.match(/(doc|docx)$/g);
              },
              'xls': function(ext) {
                  return ext.match(/(xls|xlsx)$/g);
              },
              'ppt': function(ext) {
                  return ext.match(/(ppt|pptx)$/g);
              },
              'zip': function(ext) {
                  return ext.match(/(zip|rar|tar|gzip|gz|7z)$/g);
              },
              'htm': function(ext) {
                  return ext.match(/(htm|html)$/g);
              },
              'txt': function(ext) {
                  return ext.match(/(txt|ini|csv|java|php|js|css)$/g);
              },
              'mov': function(ext) {
                  return ext.match(/(avi|mpg|mkv|mov|mp4|3gp|webm|wmv)$/g);
              },
              'audio': function(ext) {
                  return ext.match(/(mp3|wav)$/g);
              },
              'image': function(ext) {
                  return ext.match(/(gif|jpg|png)$/g);
              }
          },
          initialPreviewAsData: true,
          initialPreview: fsObjects,
          initialPreviewConfig: fsObjects.map(fsObject => {
            var parts = fsObject.split('/');
            return {caption: parts[parts.length-1], key: parts[parts.length-1]};
          }),
          initialPreviewDownloadUrl: "/fs/explorer/download/{key}"
        });
      });
  });

/*]]>*/
</script>
</body>
</html>
