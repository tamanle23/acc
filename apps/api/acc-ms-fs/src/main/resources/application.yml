      - /**/*
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
    jwtTokenHeader: Authorization
    jwtTokenSecret: VEdiOCM5e1soNSFKZV1eVw==
    jwtTokenExpiration: 604800
storage:
  file-system:
    location: /upload-files
  s3:
