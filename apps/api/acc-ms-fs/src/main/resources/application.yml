    url: sgp1.digitaloceanspaces.com
    region: sgp1
    key: 7VWHWSOWVCH4ML7FNGOT
    secret: XxIaHH61Jd37NFoc8LLUUg0oB2JW35zT8R9JX1NMhLo

################### Spring boot Configuration ##########################
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8888/eureka/
    enabled: false
ribbon:
  eager-load:
    enabled: true
server:
  port : 8081
  jetty:
    threads:
      min: 10
      max: 32
      acceptors: 2
      selectors: 4
spring:
  application:
    name: acc-ms-fs
  servlet:
    multipart:
      max-file-size: 2000MB
      max-request-size: 2000MB
      enabled: false
  mvc:
    favicon:
      enabled: false
    static-path-pattern: /resources/**
  resources:
    static-locations: resources/,classpath:META-INF/resources/,classpath:resources/,classpath:static/,classpath:public/
  thymeleaf:
    mode: LEGACYHTML5
    cache: false
  profiles:
    active: swagger
  redis:
    host : localhost
    #host : 192.168.50.253
    port : 6379
  main:
    web-environment: true
    allow-bean-definition-overriding: true
  data:
    redis:
      repositories:
        enabled: false

  datasource:
#    url: jdbc:hsqldb:hsql://localhost/acc
    url: jdbc:hsqldb:file:../../tmp/db/acc
    driver-class-name: org.hsqldb.jdbcDriver
#    url: jdbc:mysql://192.168.1.78:3306/acc
#    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: 0af3b424
    type: com.zaxxer.hikari.HikariDataSource
    continue-on-error: true
    hikari:
      idle-timeout: 10000
      maximum-pool-size: 96
      minimum-idle: 10
      connection-timeout: 60000
      initialization-fail-fast: false
  jpa:
    database: default
    show-sql: false
    hibernate:
        ddl-auto: none
        naming:
            implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
            physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
        hibernate:
            dialect: org.hibernate.dialect.HSQLDialect
#            dialect: org.hibernate.dialect.MySQL5Dialect
        search:
            default:
              directory_provider: filesystem
              indexBase: ../../tmp/indexes/
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
    serialization:
      FAIL_ON_EMPTY_BEANS: false
security:
  filter:
    order: 5

mybatis:
    type-aliases-package: com.acc.repository.domain
    mapper-locations: classpath:mappers/*.xml
    configuration:
      default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
      map-underscore-to-camel-case: true
      default-fetch-size: 100
      default-statement-timeout: 30


springdoc:
  show-spring-data-pageable: false
  show-spring-data-rest: false

