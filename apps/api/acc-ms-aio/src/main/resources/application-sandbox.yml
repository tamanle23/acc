spring:
  datasource:
    url: jdbc:postgresql://localhost:54329/postgres
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  liquibase:
    enabled: true
    change-log: classpath:db/sandbox/changelog-master.xml
    contexts: dev,test,local

application:
  sandbox:
    enabled: true
    mode: DEV
    dev:
      pristine: false
    database:
      embedded-postgres: true
      port: 54329
      dev-storage-path: ../../tmp/db/embedded-postgres
