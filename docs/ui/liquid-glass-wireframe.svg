<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Light Mode Ambient Glows -->
    <radialGradient id="cyanGlowLight" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlowLight" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Border Light Mode -->
    <linearGradient id="specularBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glass Surface Fill Light Mode -->
    <linearGradient id="glassFillLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Inner Panel Fill Light Mode -->
    <linearGradient id="innerGlassLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="500" cy="200" r="650" fill="url(#cyanGlowLight)"/>
  <circle cx="1500" cy="300" r="600" fill="url(#magentaGlowLight)"/>

  <!-- Top Light Glass Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFillLight)" stroke="url(#specularBorderLight)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#0284c7" font-size="14" font-weight="500">| Light Mode Liquid Glass Workspace</tspan></text>
    <rect x="1500" y="18" width="270" height="34" rx="8" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-width="1"/>
    <text x="1515" y="40" fill="#a21caf" font-size="13" font-weight="700">● PAUSED: HUMAN REVIEW GATE</text>
  </g>

  <!-- Left Navigation Pane -->
  <g transform="translate(60, 130)">
    <rect width="320" height="910" rx="20" fill="url(#glassFillLight)" stroke="url(#specularBorderLight)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.5">CANONICAL PIPELINES</text>

    <!-- Active Pipeline Card -->
    <rect x="16" y="60" width="288" height="64" rx="12" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1.5"/>
    <text x="36" y="90" fill="#0f172a" font-size="14" font-weight="700">Pipeline 4: Generative Story</text>
    <text x="36" y="110" fill="#0284c7" font-size="11" font-weight="600">Item 103: Creepypasta Short (9:16)</text>

    <rect x="16" y="136" width="288" height="54" rx="12" fill="url(#innerGlassLight)"/>
    <text x="36" y="168" fill="#334155" font-size="13" font-weight="500">Pipeline 1: Event Scraper</text>

    <rect x="16" y="200" width="288" height="54" rx="12" fill="url(#innerGlassLight)"/>
    <text x="36" y="232" fill="#334155" font-size="13" font-weight="500">Pipeline 2: DB Templating</text>

    <rect x="16" y="264" width="288" height="54" rx="12" fill="url(#innerGlassLight)"/>
    <text x="36" y="296" fill="#334155" font-size="13" font-weight="500">Pipeline 3: Repurposing Studio</text>
  </g>

  <!-- Center Main Pane: WebGL Video Canvas -->
  <g transform="translate(400, 130)">
    <rect width="1020" height="910" rx="20" fill="url(#glassFillLight)" stroke="url(#specularBorderLight)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Zero-Copy Video Timeline &amp; Depth3D Inspector</text>

    <!-- Video Preview Frame -->
    <rect x="330" y="70" width="360" height="640" rx="16" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <text x="440" y="380" fill="#38bdf8" font-size="14" font-weight="600">[ Video Canvas 9:16 ]</text>
    <rect x="330" y="550" width="360" height="160" fill="#d946ef" fill-opacity="0.1" stroke="#d946ef" stroke-dasharray="4"/>
    <text x="430" y="620" fill="#c026d3" font-size="11" font-weight="700">TikTok UI Safe Zone</text>

    <!-- Timeline Tracks -->
    <g transform="translate(30, 730)">
      <rect width="960" height="150" rx="12" fill="url(#innerGlassLight)" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="20" y="15" width="280" height="32" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
      <text x="30" y="36" fill="#0f172a" font-size="11" font-weight="600">Scene 1: Lab Intro (4.2s)</text>
      <rect x="310" y="15" width="340" height="32" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
      <text x="320" y="36" fill="#0f172a" font-size="11" font-weight="600">Scene 2: Creature Reveal (5.8s)</text>

      <rect x="20" y="55" width="630" height="28" rx="6" fill="#c026d3" fill-opacity="0.2" stroke="#c026d3"/>
      <text x="30" y="73" fill="#0f172a" font-size="11" font-weight="600">Kokoro TTS Voiceover (Ducked -18dB)</text>

      <!-- Playhead -->
      <line x1="280" y1="0" x2="280" y2="150" stroke="#d946ef" stroke-width="2"/>
      <polygon points="274,0 286,0 280,10" fill="#d946ef"/>
    </g>
  </g>

  <!-- Right Pane: Intervention Controls -->
  <g transform="translate(1440, 130)">
    <rect width="420" height="910" rx="20" fill="url(#glassFillLight)" stroke="url(#specularBorderLight)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#0f172a" font-size="16" font-weight="700">Intervention Controls</text>

    <text x="24" y="80" fill="#475569" font-size="12" font-weight="700">AI NARRATIVE SCRIPT</text>
    <rect x="20" y="95" width="380" height="220" rx="12" fill="url(#innerGlassLight)" stroke="#cbd5e1" stroke-width="1"/>
    <text x="36" y="125" fill="#0f172a" font-size="13" font-weight="500">"I found the abandoned radio station at 3 AM...</text>
    <text x="36" y="150" fill="#0f172a" font-size="13" font-weight="500">The static was repeating my full name."</text>

    <!-- Action Buttons -->
    <rect x="20" y="780" width="380" height="48" rx="12" fill="#059669"/>
    <text x="110" y="810" fill="#ffffff" font-size="14" font-weight="700">Approve &amp; Resume Workflow</text>

    <rect x="20" y="840" width="380" height="44" rx="12" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1"/>
    <text x="145" y="867" fill="#dc2626" font-size="13" font-weight="700">Reject &amp; Re-prompt</text>
  </g>
</svg>
