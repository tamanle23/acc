<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="emeraldGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="960" cy="200" r="700" fill="url(#emeraldGlow)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#059669" font-size="14" font-weight="500">| Interactive Choice Graph &amp; Web Sandbox (Light Mode)</tspan></text>
  </g>

  <!-- Left Pane -->
  <g transform="translate(60, 130)">
    <rect width="980" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Choice Reachability Node Graph (Item 201: Choose Your Own Adventure)</text>

    <!-- Node Graph -->
    <g transform="translate(50, 100)">
      <line x1="100" y1="200" x2="300" y2="100" stroke="#059669" stroke-width="3"/>
      <line x1="100" y1="200" x2="300" y2="300" stroke="#059669" stroke-width="3"/>
      <line x1="300" y1="100" x2="550" y2="80" stroke="#059669" stroke-width="3"/>
      <line x1="300" y1="100" x2="550" y2="180" stroke="#ef4444" stroke-width="3" stroke-dasharray="4"/>

      <!-- Root Node -->
      <circle cx="100" cy="200" r="28" fill="#059669"/>
      <text x="88" y="206" fill="#ffffff" font-size="12" font-weight="800">START</text>

      <!-- Choice Node A1 -->
      <circle cx="300" cy="100" r="24" fill="#0284c7"/>
      <text x="290" y="105" fill="#ffffff" font-size="11" font-weight="700">A1</text>

      <!-- Choice Node A2 -->
      <circle cx="300" cy="300" r="24" fill="#0284c7"/>
      <text x="290" y="305" fill="#ffffff" font-size="11" font-weight="700">A2</text>

      <!-- Ending Node 1 -->
      <circle cx="550" cy="80" r="24" fill="#059669"/>
      <text x="535" y="85" fill="#ffffff" font-size="10" font-weight="700">END 1</text>

      <!-- Orphan Node -->
      <circle cx="550" cy="180" r="24" fill="#ef4444"/>
      <text x="535" y="185" fill="#ffffff" font-size="10" font-weight="700">DEAD</text>
      <text x="600" y="185" fill="#dc2626" font-size="13" font-weight="700">◄ Alert: Unreachable Story Branch!</text>
    </g>
  </g>

  <!-- Right Pane -->
  <g transform="translate(1070, 130)">
    <rect width="790" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Sandboxed Web UI Runtime Preview</text>

    <rect x="30" y="70" width="730" height="700" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="120" fill="#059669" font-size="14" font-weight="700">CHOOSE YOUR ADVENTURE #201</text>
    <text x="60" y="170" fill="#0f172a" font-size="18" font-weight="600">"You stand before two glowing portal doors in the ancient ruins."</text>

    <rect x="60" y="220" width="670" height="54" rx="10" fill="#059669" fill-opacity="0.1" stroke="#059669"/>
    <text x="80" y="253" fill="#0f172a" font-size="14" font-weight="600">Option 1: Enter the Cyan Door (To Node A1)</text>

    <rect x="60" y="290" width="670" height="54" rx="10" fill="#9333ea" fill-opacity="0.1" stroke="#9333ea"/>
    <text x="80" y="323" fill="#0f172a" font-size="14" font-weight="600">Option 2: Enter the Purple Door (To Node A2)</text>

    <rect x="30" y="800" width="730" height="54" rx="12" fill="#059669"/>
    <text x="280" y="833" fill="#ffffff" font-size="16" font-weight="800">Fix Reachability &amp; Compile Web Widget</text>
  </g>
</svg>
