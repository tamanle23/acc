<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="emeraldGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#090d16"/>
  <circle cx="960" cy="200" r="700" fill="url(#emeraldGlow)"/>

  <!-- Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#ffffff" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#10b981" font-size="14" font-weight="400">| Interactive Choice Graph &amp; Web Sandbox Workspace (Format 5)</tspan></text>
  </g>

  <!-- Left Pane: D3 Interactive Narrative Branching Node Graph -->
  <g transform="translate(60, 130)">
    <rect width="980" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ffffff" font-size="16" font-weight="600">Choice Reachability Node Graph (Item 201: Choose Your Own Adventure)</text>

    <!-- Node Graph Connections -->
    <g transform="translate(50, 100)">
      <line x1="100" y1="200" x2="300" y2="100" stroke="#10b981" stroke-width="3"/>
      <line x1="100" y1="200" x2="300" y2="300" stroke="#10b981" stroke-width="3"/>
      <line x1="300" y1="100" x2="550" y2="80" stroke="#10b981" stroke-width="3"/>
      <line x1="300" y1="100" x2="550" y2="180" stroke="#ef4444" stroke-width="3" stroke-dasharray="4"/> <!-- Orphan Node Edge -->

      <!-- Root Node -->
      <circle cx="100" cy="200" r="28" fill="#10b981"/>
      <text x="88" y="206" fill="#090d16" font-size="12" font-weight="800">START</text>

      <!-- Choice Node A -->
      <circle cx="300" cy="100" r="24" fill="#00f0ff"/>
      <text x="290" y="105" fill="#090d16" font-size="11" font-weight="700">A1</text>

      <!-- Choice Node B -->
      <circle cx="300" cy="300" r="24" fill="#00f0ff"/>
      <text x="290" y="305" fill="#090d16" font-size="11" font-weight="700">A2</text>

      <!-- Ending Node 1 -->
      <circle cx="550" cy="80" r="24" fill="#10b981"/>
      <text x="535" y="85" fill="#090d16" font-size="10" font-weight="700">END 1</text>

      <!-- Orphan Unreachable Node (Red Alert) -->
      <circle cx="550" cy="180" r="24" fill="#ef4444"/>
      <text x="535" y="185" fill="#ffffff" font-size="10" font-weight="700">DEAD</text>
      <text x="600" y="185" fill="#ef4444" font-size="13" font-weight="600">◄ Alert: Unreachable Story Branch!</text>
    </g>
  </g>

  <!-- Right Pane: Live Sandboxed Web Component Preview (<iframe>) -->
  <g transform="translate(1070, 130)">
    <rect width="790" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ffffff" font-size="16" font-weight="600">Sandboxed Web UI Runtime Preview</text>

    <!-- Sandboxed Web Component Preview Container -->
    <rect x="30" y="70" width="730" height="700" rx="14" fill="#020617" stroke="#1e293b"/>
    <text x="60" y="120" fill="#10b981" font-size="14" font-weight="700">CHOOSE YOUR ADVENTURE #201</text>
    <text x="60" y="170" fill="#ffffff" font-size="18" font-weight="600">"You stand before two glowing portal doors in the ancient ruins."</text>

    <rect x="60" y="220" width="670" height="54" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
    <text x="80" y="253" fill="#ffffff" font-size="14">Option 1: Enter the Neon Cyan Door (To Node A1)</text>

    <rect x="60" y="290" width="670" height="54" rx="10" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7"/>
    <text x="80" y="323" fill="#ffffff" font-size="14">Option 2: Enter the Deep Purple Door (To Node A2)</text>

    <!-- Approve Button -->
    <rect x="30" y="800" width="730" height="54" rx="12" fill="#10b981" fill-opacity="0.9"/>
    <text x="280" y="833" fill="#090d16" font-size="16" font-weight="800">Fix Reachability &amp; Compile Web Widget</text>
  </g>
</svg>
