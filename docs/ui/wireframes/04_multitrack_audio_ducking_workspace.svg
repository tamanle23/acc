<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="960" cy="200" r="700" fill="url(#purpleGlow)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#9333ea" font-size="14" font-weight="500">| Multitrack Audio &amp; Sidechain Ducking Studio (Light Mode)</tspan></text>
  </g>

  <!-- Left Sidebar -->
  <g transform="translate(60, 130)">
    <rect width="320" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.5">AUDIO CONTENT TYPES</text>

    <rect x="16" y="60" width="288" height="54" rx="10" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="1"/>
    <text x="32" y="92" fill="#0f172a" font-size="13" font-weight="700">151: 2-Host Deep Dive Podcast</text>

    <rect x="16" y="124" width="288" height="54" rx="10" fill="url(#innerGlass)"/>
    <text x="32" y="156" fill="#334155" font-size="13" font-weight="500">161: 24/7 Lofi Focus Music</text>

    <rect x="16" y="188" width="288" height="54" rx="10" fill="url(#innerGlass)"/>
    <text x="32" y="220" fill="#334155" font-size="13" font-weight="500">171: Public Domain Audiobook</text>
  </g>

  <!-- Main Display -->
  <g transform="translate(400, 130)">
    <rect width="1460" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Multitrack Audio Waveform Engine &amp; DSP Sidechain Compression</text>

    <!-- Track 1 -->
    <g transform="translate(30, 80)">
      <rect width="1400" height="120" rx="12" fill="url(#innerGlass)" stroke="#cbd5e1"/>
      <text x="20" y="30" fill="#0284c7" font-size="12" font-weight="700">TRACK 1: HOST A VOICE (Kokoro TTS)</text>
      <path d="M 20 70 Q 50 20 80 70 T 140 70 T 200 10 T 260 70 T 320 110 T 380 70 T 440 20 T 500 70 T 560 70 T 620 20 T 680 70" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    </g>

    <!-- Track 2 -->
    <g transform="translate(30, 220)">
      <rect width="1400" height="120" rx="12" fill="url(#innerGlass)" stroke="#cbd5e1"/>
      <text x="20" y="30" fill="#c026d3" font-size="12" font-weight="700">TRACK 2: HOST B VOICE (F5-TTS Voice Clone)</text>
      <path d="M 300 70 Q 330 20 360 70 T 420 70 T 480 10 T 540 70 T 600 110 T 660 70 T 720 20 T 780 70" fill="none" stroke="#c026d3" stroke-width="2.5"/>
    </g>

    <!-- Track 3 -->
    <g transform="translate(30, 360)">
      <rect width="1400" height="160" rx="12" fill="url(#innerGlass)" stroke="#cbd5e1"/>
      <text x="20" y="30" fill="#9333ea" font-size="12" font-weight="700">TRACK 3: BACKGROUND MUSIC (Dynamic Sidechain Ducked -18dB)</text>
      <path d="M 20 50 L 180 50 L 200 120 L 500 120 L 520 50 L 1380 50" fill="none" stroke="#9333ea" stroke-width="3" stroke-dasharray="6"/>
      <text x="220" y="100" fill="#9333ea" font-size="11" font-weight="700">Voice Active -&gt; BGM Ducked to -18dB</text>
    </g>

    <!-- Controls -->
    <g transform="translate(30, 550)">
      <text x="0" y="20" fill="#475569" font-size="12" font-weight="700">SIDECHAIN DUCKING DSP CONTROLS</text>
      <rect x="0" y="40" width="440" height="220" rx="12" fill="url(#innerGlass)" stroke="#cbd5e1"/>
      <text x="20" y="70" fill="#0f172a" font-size="13" font-weight="600">Threshold: -18.5 dB</text>
      <text x="20" y="110" fill="#0f172a" font-size="13" font-weight="600">Attack Time: 15 ms</text>
      <text x="20" y="150" fill="#0f172a" font-size="13" font-weight="600">Release Time: 250 ms</text>
      <text x="20" y="190" fill="#0f172a" font-size="13" font-weight="600">Duck Depth Ratio: 4:1</text>
    </g>

    <!-- Approve -->
    <rect x="30" y="810" width="1400" height="54" rx="12" fill="#059669"/>
    <text x="610" y="843" fill="#ffffff" font-size="16" font-weight="800">Approve &amp; Export Audio Master</text>
  </g>
</svg>
