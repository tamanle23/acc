<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#090d16"/>
  <circle cx="960" cy="200" r="700" fill="url(#purpleGlow)"/>

  <!-- Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#ffffff" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#a855f7" font-size="14" font-weight="400">| Multitrack Audio &amp; Dynamic Sidechain Ducking Studio (Format 4)</tspan></text>
  </g>

  <!-- Left Sidebar Navigation -->
  <g transform="translate(60, 130)">
    <rect width="320" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">AUDIO CONTENT TYPES</text>

    <rect x="16" y="60" width="288" height="54" rx="10" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
    <text x="32" y="92" fill="#ffffff" font-size="13" font-weight="600">151: 2-Host Deep Dive Podcast</text>

    <rect x="16" y="124" width="288" height="54" rx="10" fill="url(#innerGlass)"/>
    <text x="32" y="156" fill="#cbd5e1" font-size="13">161: 24/7 Lofi Focus Music</text>

    <rect x="16" y="188" width="288" height="54" rx="10" fill="url(#innerGlass)"/>
    <text x="32" y="220" fill="#cbd5e1" font-size="13">171: Public Domain Audiobook</text>
  </g>

  <!-- Main Waveform Display & Ducking Curves -->
  <g transform="translate(400, 130)">
    <rect width="1460" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ffffff" font-size="16" font-weight="600">Multitrack Audio Waveform Engine &amp; DSP Sidechain Compression</text>

    <!-- Track 1: Host A Voice -->
    <g transform="translate(30, 80)">
      <rect width="1400" height="120" rx="12" fill="url(#innerGlass)" stroke="#334155"/>
      <text x="20" y="30" fill="#00f0ff" font-size="12" font-weight="700">TRACK 1: HOST A VOICE (Kokoro TTS)</text>
      <!-- Simulated Waveform -->
      <path d="M 20 70 Q 50 20 80 70 T 140 70 T 200 10 T 260 70 T 320 110 T 380 70 T 440 20 T 500 70 T 560 70 T 620 20 T 680 70" fill="none" stroke="#00f0ff" stroke-width="2"/>
    </g>

    <!-- Track 2: Host B Voice -->
    <g transform="translate(30, 220)">
      <rect width="1400" height="120" rx="12" fill="url(#innerGlass)" stroke="#334155"/>
      <text x="20" y="30" fill="#ff007f" font-size="12" font-weight="700">TRACK 2: HOST B VOICE (F5-TTS Voice Clone)</text>
      <path d="M 300 70 Q 330 20 360 70 T 420 70 T 480 10 T 540 70 T 600 110 T 660 70 T 720 20 T 780 70" fill="none" stroke="#ff007f" stroke-width="2"/>
    </g>

    <!-- Track 3: BGM Track with Dynamic Ducking Attenuation Curve -->
    <g transform="translate(30, 360)">
      <rect width="1400" height="160" rx="12" fill="url(#innerGlass)" stroke="#334155"/>
      <text x="20" y="30" fill="#a855f7" font-size="12" font-weight="700">TRACK 3: BACKGROUND MUSIC (Dynamic Sidechain Ducked -18dB)</text>
      <!-- Ducking Envelope Curve -->
      <path d="M 20 50 L 180 50 L 200 120 L 500 120 L 520 50 L 1380 50" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="6"/>
      <text x="220" y="100" fill="#a855f7" font-size="11">Voice Active -&gt; BGM Ducked to -18dB</text>
    </g>

    <!-- DSP Ducking Controls -->
    <g transform="translate(30, 550)">
      <text x="0" y="20" fill="#94a3b8" font-size="12" font-weight="700">SIDECHAIN DUCKING DSP CONTROLS</text>
      <rect x="0" y="40" width="440" height="220" rx="12" fill="url(#innerGlass)" stroke="#334155"/>
      <text x="20" y="70" fill="#ffffff" font-size="13">Threshold: -18.5 dB</text>
      <text x="20" y="110" fill="#ffffff" font-size="13">Attack Time: 15 ms</text>
      <text x="20" y="150" fill="#ffffff" font-size="13">Release Time: 250 ms</text>
      <text x="20" y="190" fill="#ffffff" font-size="13">Duck Depth Ratio: 4:1</text>
    </g>

    <!-- Approve Button -->
    <rect x="30" y="810" width="1400" height="54" rx="12" fill="#10b981" fill-opacity="0.9"/>
    <text x="610" y="843" fill="#090d16" font-size="16" font-weight="800">Approve &amp; Export Audio Master</text>
  </g>
</svg>
