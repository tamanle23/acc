<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#090d16"/>
  <circle cx="960" cy="200" r="700" fill="url(#cyanGlow)"/>

  <!-- Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#ffffff" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#00f0ff" font-size="14" font-weight="400">| Zero-Copy WebGL Video Timeline Workspace (Format 3)</tspan></text>
  </g>

  <!-- Left Sidebar Navigation -->
  <g transform="translate(60, 130)">
    <rect width="300" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">FORMAT 3 VIDEO TYPES</text>

    <rect x="16" y="60" width="268" height="54" rx="10" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1"/>
    <text x="32" y="92" fill="#ffffff" font-size="13" font-weight="600">103: Horror Story (9:16)</text>

    <rect x="16" y="124" width="268" height="54" rx="10" fill="url(#innerGlass)"/>
    <text x="32" y="156" fill="#cbd5e1" font-size="13">111: Bar Chart Racing</text>

    <rect x="16" y="188" width="268" height="54" rx="10" fill="url(#innerGlass)"/>
    <text x="32" y="220" fill="#cbd5e1" font-size="13">121: AI Short Films</text>
  </g>

  <!-- Center Main Pane: WebGL Canvas & Timeline -->
  <g transform="translate(380, 130)">
    <rect width="1080" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ffffff" font-size="16" font-weight="600">Zero-Copy WebCodecs Player &amp; Multi-Track Timeline</text>

    <!-- 9:16 Video Canvas -->
    <rect x="360" y="70" width="360" height="620" rx="16" fill="#000000" stroke="#334155" stroke-width="2"/>
    <text x="450" y="370" fill="#00f0ff" font-size="14" font-weight="500">[ Video Canvas 9:16 ]</text>
    <!-- TikTok UI Overlay Boundary -->
    <rect x="360" y="550" width="360" height="140" fill="#ff007f" fill-opacity="0.1" stroke="#ff007f" stroke-dasharray="4"/>
    <text x="440" y="620" fill="#ff70b8" font-size="11">TikTok Overlay Safe Zone</text>

    <!-- Multi-Track Timeline -->
    <g transform="translate(30, 710)">
      <rect width="1020" height="170" rx="14" fill="url(#innerGlass)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="25" fill="#94a3b8" font-size="11" font-weight="700">MULTI-TRACK TIMELINE (FFmpeg FFI Direct Assembly)</text>

      <!-- Video Scene Track -->
      <rect x="100" y="38" width="320" height="30" rx="6" fill="#00f0ff" fill-opacity="0.3" stroke="#00f0ff"/>
      <text x="110" y="58" fill="#ffffff" font-size="11">Scene 1: Lab Intro (4.2s)</text>
      <rect x="430" y="38" width="480" height="30" rx="6" fill="#00f0ff" fill-opacity="0.3" stroke="#00f0ff"/>
      <text x="440" y="58" fill="#ffffff" font-size="11">Scene 2: Creature Reveal (6.5s)</text>

      <!-- Audio Voiceover Track -->
      <rect x="100" y="76" width="810" height="28" rx="6" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7"/>
      <text x="110" y="94" fill="#ffffff" font-size="11">Kokoro TTS Narration (Ducked -18dB)</text>

      <!-- Playhead -->
      <line x1="380" y1="30" x2="380" y2="160" stroke="#ff007f" stroke-width="2"/>
      <polygon points="374,30 386,30 380,40" fill="#ff007f"/>
    </g>
  </g>

  <!-- Right Pane: Controls & Depth3D Tuning -->
  <g transform="translate(1480, 130)">
    <rect width="380" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#ffffff" font-size="16" font-weight="600">Depth3D &amp; FX Controls</text>

    <text x="24" y="90" fill="#94a3b8" font-size="12" font-weight="700">DEPTH3D POP-OUT INTENSITY</text>
    <rect x="24" y="110" width="332" height="12" rx="6" fill="#1e293b"/>
    <rect x="24" y="110" width="220" height="12" rx="6" fill="#00f0ff"/>

    <text x="24" y="160" fill="#94a3b8" font-size="12" font-weight="700">PARALLAX FOCAL LENGTH</text>
    <rect x="24" y="180" width="332" height="12" rx="6" fill="#1e293b"/>
    <rect x="24" y="180" width="160" height="12" rx="6" fill="#a855f7"/>

    <rect x="24" y="780" width="332" height="50" rx="12" fill="#10b981" fill-opacity="0.9"/>
    <text x="90" y="811" fill="#090d16" font-size="14" font-weight="800">Approve &amp; Render Video</text>
  </g>
</svg>
