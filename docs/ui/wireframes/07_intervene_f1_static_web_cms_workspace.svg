<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="cyanGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="400" cy="200" r="600" fill="url(#cyanGlow)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#0284c7" font-size="14" font-weight="500">| Format 1 Intervene Workspace (Static Web Post CMS publishing)</tspan></text>
    <rect x="1500" y="18" width="270" height="34" rx="8" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-width="1"/>
    <text x="1515" y="40" fill="#a21caf" font-size="13" font-weight="700">● PAUSED: HUMAN REVIEW GATE</text>
  </g>

  <!-- Split View -->
  <g transform="translate(60, 130)">
    <rect width="880" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Source Ingest Markdown / HTML Body</text>
    <rect x="30" y="65" width="820" height="800" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="105" fill="#0f172a" font-size="14"># Industry Digest Item 1</text>
    <text x="50" y="135" fill="#334155" font-size="13">Scraped from TechCrunch RSS feed. Requires tone check and SEO title tag confirmation...</text>
  </g>

  <g transform="translate(970, 130)">
    <rect width="890" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Rendered WordPress / Ghost CMS Post Preview</text>

    <rect x="30" y="65" width="830" height="680" rx="16" fill="url(#innerGlass)" stroke="#cbd5e1"/>
    <text x="60" y="120" fill="#0284c7" font-size="14" font-weight="700">ARTICLE PREVIEW • WordPress / Ghost</text>
    <text x="60" y="160" fill="#0f172a" font-size="20" font-weight="700">Daily Industry Digest: AI &amp; Infrastructure Advances</text>

    <!-- Approve Button -->
    <rect x="30" y="780" width="830" height="54" rx="12" fill="#059669"/>
    <text x="340" y="813" fill="#ffffff" font-size="16" font-weight="800">Publish Article &amp; Resume Workflow</text>
  </g>
</svg>
