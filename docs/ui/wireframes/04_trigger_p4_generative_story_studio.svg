<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="magentaGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="400" cy="200" r="600" fill="url(#magentaGlow)"/>

  <!-- Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#c026d3" font-size="14" font-weight="500">| Pipeline 4 Trigger Studio (Autonomous Generative Storytelling)</tspan></text>
  </g>

  <!-- Content Grid -->
  <g transform="translate(60, 130)">
    <rect width="1800" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="40" y="45" fill="#0f172a" font-size="18" font-weight="700">Character LoRA Selector Grid &amp; Story Prompt Seed Matrix</text>

    <!-- Character LoRA Grid -->
    <text x="40" y="85" fill="#475569" font-size="12" font-weight="700">TRAINED CHARACTER LORA FACE LOCKS</text>
    <rect x="40" y="105" width="400" height="280" rx="14" fill="url(#innerGlass)" stroke="#d946ef"/>
    <text x="60" y="240" fill="#0f172a" font-size="14" font-weight="700">LoRA #1: Cyber Detective</text>

    <rect x="470" y="105" width="400" height="280" rx="14" fill="url(#innerGlass)" stroke="#cbd5e1"/>
    <text x="490" y="240" fill="#0f172a" font-size="14" font-weight="700">LoRA #2: Victorian Scholar</text>

    <rect x="900" y="105" width="400" height="280" rx="14" fill="url(#innerGlass)" stroke="#cbd5e1"/>
    <text x="920" y="240" fill="#0f172a" font-size="14" font-weight="700">LoRA #3: Sci-Fi Pilot</text>

    <!-- Prompt AST Input -->
    <text x="40" y="425" fill="#475569" font-size="12" font-weight="700">STORY AST SEED PROMPT MATRIX</text>
    <rect x="40" y="445" width="1720" height="300" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="485" fill="#0f172a" font-size="14" font-weight="600">Prompt: "In a neon rain-soaked alley in 2088, Detective Vance discovers a glowing cipher."</text>

    <!-- Launch Button -->
    <rect x="40" y="780" width="1720" height="60" rx="14" fill="#c026d3"/>
    <text x="750" y="818" fill="#ffffff" font-size="16" font-weight="800">LAUNCH PIPELINE 4 WORKFLOW NOW</text>
  </g>
</svg>
