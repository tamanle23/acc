<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#090d16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="cyanGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#090d16"/>
  <circle cx="400" cy="200" r="600" fill="url(#cyanGlow)"/>

  <!-- Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#ffffff" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#00f0ff" font-size="14" font-weight="400">| Pipeline Trigger &amp; Seed Studio (Before Stage)</tspan></text>
  </g>

  <!-- Left Sidebar: Pipeline Selector -->
  <g transform="translate(60, 130)">
    <rect width="320" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">PIPELINE SELECTION</text>

    <rect x="16" y="60" width="288" height="60" rx="12" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1"/>
    <text x="36" y="95" fill="#ffffff" font-size="14" font-weight="600">P1: Event Scraper &amp; Digest</text>

    <rect x="16" y="130" width="288" height="60" rx="12" fill="url(#innerGlass)"/>
    <text x="36" y="165" fill="#cbd5e1" font-size="14">P2: DB Injection &amp; Specs</text>

    <rect x="16" y="200" width="288" height="60" rx="12" fill="url(#innerGlass)"/>
    <text x="36" y="235" fill="#cbd5e1" font-size="14">P3: Asset Repurposing</text>

    <rect x="16" y="270" width="288" height="60" rx="12" fill="url(#innerGlass)"/>
    <text x="36" y="305" fill="#cbd5e1" font-size="14">P4: Generative Storytelling</text>

    <rect x="16" y="340" width="288" height="60" rx="12" fill="url(#innerGlass)"/>
    <text x="36" y="375" fill="#cbd5e1" font-size="14">P5: Math &amp; Rule Solvers</text>

    <rect x="16" y="410" width="288" height="60" rx="12" fill="url(#innerGlass)"/>
    <text x="36" y="445" fill="#cbd5e1" font-size="14">P6: Infinite Ambient Loops</text>
  </g>

  <!-- Main Content: Trigger Seed Configurator -->
  <g transform="translate(400, 130)">
    <rect width="1460" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="40" y="45" fill="#ffffff" font-size="18" font-weight="600">Pipeline 1 Configuration &amp; Ingestion Rules</text>

    <!-- Source Feed Matrix -->
    <text x="40" y="90" fill="#94a3b8" font-size="12" font-weight="700">WHITELISTED INGESTION SOURCES</text>
    <rect x="40" y="105" width="430" height="110" rx="12" fill="url(#innerGlass)" stroke="#334155"/>
    <text x="60" y="140" fill="#ffffff" font-size="14" font-weight="600">TechCrunch &amp; HackerNews RSS</text>
    <text x="60" y="165" fill="#10b981" font-size="12">● Status: Active (Polling every 5m)</text>

    <rect x="490" y="105" width="430" height="110" rx="12" fill="url(#innerGlass)" stroke="#334155"/>
    <text x="510" y="140" fill="#ffffff" font-size="14" font-weight="600">CoinGecko Volatility Webhook</text>
    <text x="510" y="165" fill="#10b981" font-size="12">● Trigger: BTC Delta &gt; 3.0%</text>

    <rect x="940" y="105" width="480" height="110" rx="12" fill="url(#innerGlass)" stroke="#334155"/>
    <text x="960" y="140" fill="#ffffff" font-size="14" font-weight="600">GitHub Trending GraphQL API</text>
    <text x="960" y="165" fill="#10b981" font-size="12">● Filter: Min 500 Stars / Day</text>

    <!-- Code & Grammar Rule Editor -->
    <text x="40" y="255" fill="#94a3b8" font-size="12" font-weight="700">vLLM QWEN2.5 JSON GRAMMAR RULES</text>
    <rect x="40" y="270" width="1380" height="480" rx="14" fill="#030712" stroke="#1e293b"/>
    <text x="60" y="310" fill="#00f0ff" font-family="monospace" font-size="13">root ::= "{" whitespace "\"headline\":" string "," whitespace "\"summary\":" string "," whitespace "\"targetFormats\":" format_array "}"</text>
    <text x="60" y="340" fill="#a855f7" font-family="monospace" font-size="13">format_array ::= "[" "\"static-web\"," "\"social-thread\"," "\"video-short\"" "]"</text>

    <!-- Launch Trigger Button -->
    <rect x="40" y="780" width="1380" height="60" rx="14" fill="#00f0ff" fill-opacity="0.9"/>
    <text x="610" y="818" fill="#090d16" font-size="16" font-weight="800" letter-spacing="1">LAUNCH WORKFLOW PIPELINE NOW</text>
  </g>
</svg>
