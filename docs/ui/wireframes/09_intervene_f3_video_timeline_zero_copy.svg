<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="960" cy="200" r="700" fill="url(#cyanGlow)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#0284c7" font-size="14" font-weight="500">| Format 3 Intervene Workspace (Zero-Copy Video &amp; Multi-Track Timeline)</tspan></text>
  </g>

  <!-- Left Sidebar -->
  <g transform="translate(60, 130)">
    <rect width="300" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#475569" font-size="12" font-weight="700" letter-spacing="1.5">VIDEO FORMAT TYPES</text>
    <rect x="16" y="60" width="268" height="54" rx="10" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7"/>
    <text x="32" y="92" fill="#0f172a" font-size="13" font-weight="700">TikTok 9:16 Short Film</text>
  </g>

  <!-- Center Main Pane -->
  <g transform="translate(380, 130)">
    <rect width="1080" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Zero-Copy WebCodecs Frame Preview Player</text>

    <rect x="360" y="70" width="360" height="620" rx="16" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <text x="450" y="370" fill="#38bdf8" font-size="14" font-weight="600">[ WebGL Canvas 9:16 ]</text>

    <!-- Timeline -->
    <g transform="translate(30, 710)">
      <rect width="1020" height="170" rx="14" fill="url(#innerGlass)" stroke="#cbd5e1"/>
      <rect x="100" y="38" width="320" height="30" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
      <text x="110" y="58" fill="#0f172a" font-size="11" font-weight="600">Scene 1: Lab Intro (4.2s)</text>
    </g>
  </g>

  <!-- Right Pane -->
  <g transform="translate(1480, 130)">
    <rect width="380" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="24" y="40" fill="#0f172a" font-size="16" font-weight="700">Depth3D Controls</text>
    <rect x="24" y="780" width="332" height="50" rx="12" fill="#059669"/>
    <text x="90" y="811" fill="#ffffff" font-size="14" font-weight="800">Approve &amp; Render Video</text>
  </g>
</svg>
