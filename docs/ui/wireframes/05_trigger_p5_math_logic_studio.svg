<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="emeraldGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="400" cy="200" r="600" fill="url(#emeraldGlow)"/>

  <!-- Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#059669" font-size="14" font-weight="500">| Pipeline 5 Trigger Studio (Rule-Based &amp; Math Logic Generation)</tspan></text>
  </g>

  <!-- Content Grid -->
  <g transform="translate(60, 130)">
    <rect width="1800" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="40" y="45" fill="#0f172a" font-size="18" font-weight="700">KaTeX Math Formula Canvas &amp; Matter.js / Manim Simulation Controls</text>

    <!-- KaTeX Equation Canvas -->
    <rect x="40" y="80" width="1720" height="320" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="115" fill="#059669" font-size="14" font-weight="700">KATEX / LATEX MATHEMATICAL EQUATION CANVAS (Items 22, 112, 183)</text>
    <text x="60" y="170" fill="#0f172a" font-family="monospace" font-size="18">E = mc^2 \quad \text{and} \quad \int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}</text>

    <!-- Physics Simulation Controls -->
    <rect x="40" y="430" width="1720" height="320" rx="14" fill="url(#innerGlass)" stroke="#cbd5e1"/>
    <text x="60" y="465" fill="#059669" font-size="14" font-weight="700">MATTER.JS / MANIM PHYSICS SIMULATION SLIDERS</text>
    <text x="60" y="500" fill="#0f172a" font-size="13">Gravity: 9.81 m/s² | Friction: 0.1 | Restitution Coefficient: 0.85</text>

    <!-- Launch Button -->
    <rect x="40" y="780" width="1720" height="60" rx="14" fill="#059669"/>
    <text x="750" y="818" fill="#ffffff" font-size="16" font-weight="800">LAUNCH PIPELINE 5 WORKFLOW NOW</text>
  </g>
</svg>
