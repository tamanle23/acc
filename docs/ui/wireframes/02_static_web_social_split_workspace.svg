<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="magentaGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="1500" cy="200" r="600" fill="url(#magentaGlow)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="1800" height="70" rx="16" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="42" fill="#0f172a" font-size="20" font-weight="700">ACC CONTROL PLANE <tspan fill="#c026d3" font-size="14" font-weight="500">| Static Web &amp; Social Intervene Workspace (Light Mode)</tspan></text>
    <rect x="1500" y="18" width="270" height="34" rx="8" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-width="1"/>
    <text x="1515" y="40" fill="#a21caf" font-size="13" font-weight="700">● PAUSED: HUMAN REVIEW GATE</text>
  </g>

  <!-- Left Pane -->
  <g transform="translate(60, 130)">
    <rect width="880" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Raw Source Material &amp; Article Ingest</text>

    <rect x="30" y="65" width="820" height="800" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="105" fill="#9333ea" font-family="monospace" font-size="14" font-weight="700">Item 51: Book Summary Thread ("Atomic Habits")</text>
    <text x="50" y="140" fill="#0f172a" font-family="sans-serif" font-size="14">Key Principle 1: Small 1% improvements accumulate exponentially over time.</text>
    <text x="50" y="170" fill="#0f172a" font-family="sans-serif" font-size="14">Key Principle 2: Systems dictate outcomes, not goals.</text>
  </g>

  <!-- Right Pane -->
  <g transform="translate(970, 130)">
    <rect width="890" height="910" rx="20" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="1.5"/>
    <text x="30" y="40" fill="#0f172a" font-size="16" font-weight="700">Rendered Liquid Glass Social Card &amp; Thread Preview</text>

    <!-- Social Quote Card Render -->
    <rect x="30" y="65" width="830" height="360" rx="16" fill="url(#innerGlass)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="60" y="120" fill="#0284c7" font-size="12" font-weight="700">@ACC_DIGEST • QUOTE CARD PREVIEW</text>
    <text x="60" y="180" fill="#0f172a" font-size="22" font-weight="700">"You do not rise to the level of your goals.</text>
    <text x="60" y="215" fill="#0f172a" font-size="22" font-weight="700">You fall to the level of your systems."</text>

    <!-- AI Refactoring Quick Buttons -->
    <text x="30" y="460" fill="#475569" font-size="12" font-weight="700">AI REFACTORING QUICK CONTROLS</text>
    <rect x="30" y="480" width="260" height="44" rx="10" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1"/>
    <text x="75" y="507" fill="#0369a1" font-size="13" font-weight="700">Make Punchier Hook</text>

    <rect x="310" y="480" width="260" height="44" rx="10" fill="#9333ea" fill-opacity="0.1" stroke="#9333ea" stroke-width="1"/>
    <text x="370" y="507" fill="#7e22ce" font-size="13" font-weight="700">Simplify to ELI5</text>

    <rect x="590" y="480" width="270" height="44" rx="10" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="1"/>
    <text x="635" y="507" fill="#047857" font-size="13" font-weight="700">Check Brand Safety</text>

    <!-- Action Buttons -->
    <rect x="30" y="770" width="830" height="54" rx="12" fill="#059669"/>
    <text x="340" y="803" fill="#ffffff" font-size="16" font-weight="800">Approve &amp; Resume Conductor Workflow</text>

    <rect x="30" y="835" width="830" height="44" rx="12" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1"/>
    <text x="380" y="862" fill="#dc2626" font-size="13" font-weight="700">Reject &amp; Cancel Workflow</text>
  </g>
</svg>
